<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Aspose.PDF for JavaScript via C++</title>
</head>

<body>
  <label for="fileReorderPages">Choose a PDF-file to reorder pages</label>
  <input type="file" id="fileReorderPages" accept="application/pdf" onchange="ffileReorderPages(event)">
  <br>
  <pre id="output"></pre>
</body>
<!-- Load and initiate Aspose.PDF for JavaScript via C++ -->
<script type="text/javascript" async src="AsposePDFforJS.js"></script>
<script type="text/javascript">
/// [Code snippet]
  var ffileReorderPages = function (e) {
    const file_reader = new FileReader();
    file_reader.onload = (event) => {
      /*array, source page numbers in the desired order, 1-based*/
      const numPages = [3,2,1];
      /*Reorder pages in a PDF-file and save the "ResultReorderPages.pdf"*/
      const json = AsposePdfReorderPages(event.target.result, e.target.files[0].name, "ResultReorderPages.pdf", numPages);
      if (json.errorCode == 0) document.getElementById('output').textContent = json.fileNameResult
      else document.getElementById('output').textContent = json.errorText;
      /*Make a link to download the result file*/
      DownloadFile(json.fileNameResult, "application/pdf");
    };
    file_reader.readAsArrayBuffer(e.target.files[0]);
  };
/// [Code snippet]
</script>

</html>
